name: CI

on:
  push:
    paths-ignore: ['docs/**', '.github/workflows/docs.yml', '.readthedocs.yaml']
  pull_request:
    paths-ignore: ['docs/**', '.github/workflows/docs.yml', '.readthedocs.yaml']

# Cancels all previous workflow runs for the same branch that have not yet completed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:

  tests:
    name: "PHP ${{ matrix.php }}${{ matrix.with_coverage == true && ' with coverage' || ''}}${{ matrix.mink_version == '2-architecture-changes' && ' (Mink 2.x)' || '' }}"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: [ '7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5' ]
        with_coverage: [ false ]
        include:
          - php: '7.4'
            with_coverage: true
          - php: '8.5'
            with_coverage: false
            mink_version: '2-architecture-changes'
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          coverage: "xdebug"
          php-version: "${{ matrix.php }}"
          tools: composer
          # PHP 7.1 development web server segfaults if timezone not set.
          ini-values: date.timezone=Europe/Paris, error_reporting=-1, display_errors=On

      - name: Configure Symfony Error Handler
        run: |
          composer require --no-update --dev symfony/error-handler "^4.4 || ^5.0"

      - name: Configure for Mink 2.x architecture
        if: "${{ matrix.mink_version == '2-architecture-changes' }}"
        run: |
          composer require --no-update "behat/mink:dev-2-architecture-changes as 1.99"

      - name: Install dependencies
        uses: "ramsey/composer-install@v4"
        with:
          dependency-versions: "highest"

      - name: Setup web server
        run: |
          php -S localhost:8002 -t $(pwd) > /dev/null 2> /tmp/webserver_output.txt &
          while ! nc -z localhost 8002 </dev/null; do echo Waiting for PHP server to start...; sleep 1; done
          sed -i -e "s,http://localhost,http://localhost:8002,g" phpunit.xml.dist
          sed -i -e "s,firefox,chrome,g" phpunit.xml.dist

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@latest
        with:
          chrome-version: "stable"

      - name: Setup ChromeDriver
        uses: nanasess/setup-chromedriver@v3

      - name: Start virtual frame buffer and Selenium server
        run: |
          Xvfb -ac :99 -screen 0 1280x1024x16 > /dev/null 2>&1 &
          export DISPLAY=:99
          sleep 3
          tests/run_selenium.sh

      - name: Run tests with Coverage
        if: "${{ matrix.with_coverage == true }}"
        run: |
          vendor/bin/phpunit -v --log-junit junit.xml --coverage-clover=coverage.clover

      - name: Run tests without Coverage
        if: "${{ matrix.with_coverage == false }}"
        run: |
          vendor/bin/phpunit -v --log-junit junit.xml

      - name: Upload Coverage to Codecov
        if: "${{ matrix.with_coverage == true }}"
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results

      - name: Upload Coverage to Scrutinizer CI
        if: "${{ matrix.with_coverage == true }}"
        run: |
          REPOSITORY='g/qa-tools/qa-tools'
          REVISION="${GITHUB_SHA}"
          BASE_PATH="$(git rev-parse --show-toplevel)/"
          PARENTS="$(git show -s --format=%P HEAD)"

          sed "s#${BASE_PATH}#{scrutinizer_project_base_path}/#g" coverage.clover \
            | base64 -w0 > coverage.clover.base64

          jq -n \
            --arg revision "$REVISION" \
            --arg parents "$PARENTS" \
            --arg format "php-clover" \
            --rawfile data coverage.clover.base64 \
            '{
              revision: $revision,
              parents: ($parents | split(" ") | map(select(length > 0))),
              coverage: {
                format: $format,
                data: $data
              }
            }' > scrutinizer-payload.json

          curl -fsS -X POST \
            "https://scrutinizer-ci.com/api/repositories/${REPOSITORY}/data/code-coverage" \
            -H 'Content-Type: application/json' \
            --data @scrutinizer-payload.json
